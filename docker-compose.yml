services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server

volumes:
  uploads:
