# Build both images, push them to Docker Hub, then tell the Oracle server to pull and restart.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub user that owns the veroitaliano-* repositories
#   DOCKERHUB_TOKEN     Docker Hub access token (Read & Write), not the password
#   SSH_HOST            server address
#   SSH_USER            server user
#   SSH_KEY             private half of a deploy-only SSH key (see README "CI/CD")
#   SSH_KNOWN_HOSTS     the server's ed25519 host key ("ssh-ed25519 AAAA...", from
#                       /etc/ssh/ssh_host_ed25519_key.pub); a leading host/IP is ignored
#
# On the server, the deploy key is locked in ~/.ssh/authorized_keys with command="...", so this
# workflow can only run the update command and nothing else.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64
          push: true
          # :latest is what the server pulls; :<commit> is kept for rollbacks
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/veroitaliano-${{ matrix.app }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/veroitaliano-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Update the server
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # tolerate pasted extras in the secrets: spaces, new lines, a "SSH_HOST:" label, "user@"
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r' | tr -s ' \n\t' '\n' | grep -v ':$' | tail -1 | sed 's/.*@//')
          USER_=$(printf '%s' "$SSH_USER" | tr -d '\r' | tr -s ' \n\t' '\n' | grep -v ':$' | tail -1)
          if [ -z "$HOST" ] || [ -z "$USER_" ]; then echo "::error::SSH_HOST or SSH_USER is empty"; exit 1; fi
          # pin the server key under a fixed alias, so the check doesn't depend on how SSH_HOST is written
          # an ed25519 public key is always "AAAAC3NzaC1lZDI1NTE5AAAAI" + 43 more base64 characters;
          # remove all whitespace first, so a key that wrapped onto several lines when copied still works
          B64=$(printf '%s' "$SSH_KNOWN_HOSTS" | tr -d ' \t\r\n' | grep -oE 'AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}' | head -1)
          if [ -z "$B64" ]; then echo "::error::SSH_KNOWN_HOSTS doesn't contain a complete ssh-ed25519 key"; exit 1; fi
          printf 'vero-server ssh-ed25519 %s\n' "$B64" > ~/.ssh/known_hosts
          echo "Pinned server key fingerprint (compare with the server):"
          ssh-keygen -lf ~/.ssh/known_hosts
          # the server's forced command does the update; StrictHostKeyChecking=yes refuses any other key
          ssh -T -i ~/.ssh/deploy_key -o HostKeyAlias=vero-server -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_@$HOST"
          rm -f ~/.ssh/deploy_key
